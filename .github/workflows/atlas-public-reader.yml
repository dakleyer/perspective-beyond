name: Atlas public reader
on:
  push:
    paths: ['docs/atlas/mapa/grafo.json', 'docs/atlas/lectura/**', 'scripts/build_atlas_public_reader.py', 'scripts/check_atlas_public_reader.py', '.github/workflows/atlas-public-reader.yml']
  pull_request:
    paths: ['docs/atlas/mapa/grafo.json', 'docs/atlas/lectura/**', 'scripts/build_atlas_public_reader.py', 'scripts/check_atlas_public_reader.py', '.github/workflows/atlas-public-reader.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_atlas_public_reader.py --check
      - run: python scripts/check_atlas_public_reader.py
